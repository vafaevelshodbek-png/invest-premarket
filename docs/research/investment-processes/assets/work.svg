<svg xmlns="http://www.w3.org/2000/svg" width="960" height="392" viewBox="0 0 960 392" role="img"><title>work</title><rect width="100%" height="100%" fill="#ffffff"/><rect x="24.0" y="24" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44.0" y="58" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Подготовка решения</text><text x="44.0" y="100" font-family="Arial, sans-serif" font-size="18" fill="#425565">Цели, сведения и оценка вариантов.</text><text x="44.0" y="125" font-family="Arial, sans-serif" font-size="18" fill="#425565">Результат: выбранное действие.</text><rect x="488.0" y="24" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508.0" y="58" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Заключение сделки</text><text x="508.0" y="100" font-family="Arial, sans-serif" font-size="18" fill="#425565">Проверка и исполнение поручения.</text><text x="508.0" y="125" font-family="Arial, sans-serif" font-size="18" fill="#425565">Результат: сделка или статус отказа.</text><rect x="24.0" y="204" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44.0" y="238" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Исполнение обязательств</text><text x="44.0" y="280" font-family="Arial, sans-serif" font-size="18" fill="#425565">Передача денег и активов. Результат:</text><text x="44.0" y="305" font-family="Arial, sans-serif" font-size="18" fill="#425565">подтверждённые движения.</text><rect x="488.0" y="204" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508.0" y="238" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Сопровождение вложения</text><text x="508.0" y="280" font-family="Arial, sans-serif" font-size="18" fill="#425565">Выплаты, события и пересмотр. Результат:</text><text x="508.0" y="305" font-family="Arial, sans-serif" font-size="18" fill="#425565">обновлённая позиция.</text></svg>

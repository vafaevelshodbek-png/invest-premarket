<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="534" viewBox="0 0 1160 534" role="img"><title>Работы участников инвестиционной деятельности</title><rect width="100%" height="100%" fill="white"/><rect x="20.0" y="20" width="551.0" height="145" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="40.0" y="54" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Риск и обеспечение обязательств</text><text x="40.0" y="92" font-family="Arial, sans-serif" font-size="19" fill="#425565">Оценка и ограничение рисков</text><text x="40.0" y="132" font-family="Arial, sans-serif" font-size="19" fill="#425565">Контроль обеспечения</text><rect x="589.0" y="20" width="551.0" height="330" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="609.0" y="54" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Соблюдение требований</text><text x="609.0" y="92" font-family="Arial, sans-serif" font-size="19" fill="#425565">Внутренний контроль и соблюдение требований</text><text x="609.0" y="132" font-family="Arial, sans-serif" font-size="19" fill="#425565">Конфликт интересов</text><text x="609.0" y="172" font-family="Arial, sans-serif" font-size="19" fill="#425565">Финансовый мониторинг</text><text x="609.0" y="212" font-family="Arial, sans-serif" font-size="19" fill="#425565">Контроль инсайдерской информации и</text><text x="609.0" y="237" font-family="Arial, sans-serif" font-size="19" fill="#425565">манипулирования</text><text x="609.0" y="277" font-family="Arial, sans-serif" font-size="19" fill="#425565">Контроль специализированного депозитария</text><text x="609.0" y="317" font-family="Arial, sans-serif" font-size="19" fill="#425565">Внутренний аудит</text><rect x="20.0" y="183" width="551.0" height="145" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="40.0" y="217" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Обслуживание клиента</text><text x="40.0" y="255" font-family="Arial, sans-serif" font-size="19" fill="#425565">Клиентский доступ</text><text x="40.0" y="295" font-family="Arial, sans-serif" font-size="19" fill="#425565">Информация и обращения</text><rect x="589.0" y="368" width="551.0" height="145" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="609.0" y="402" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Данные</text><text x="609.0" y="440" font-family="Arial, sans-serif" font-size="19" fill="#425565">Снабжение данными</text><text x="609.0" y="480" font-family="Arial, sans-serif" font-size="19" fill="#425565">Качество данных</text><rect x="20.0" y="346" width="551.0" height="170" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="40.0" y="380" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Техническая среда</text><text x="40.0" y="418" font-family="Arial, sans-serif" font-size="19" fill="#425565">Работоспособность систем и восстановление</text><text x="40.0" y="443" font-family="Arial, sans-serif" font-size="19" fill="#425565">после сбоев</text><text x="40.0" y="483" font-family="Arial, sans-serif" font-size="19" fill="#425565">Информационная безопасность</text></svg>
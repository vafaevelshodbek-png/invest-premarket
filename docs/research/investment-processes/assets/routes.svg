<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680"><title>Примеры порядка работы и возвратов</title><rect width="100%" height="100%" fill="white"/><text x="20" y="30" font-family="Arial" font-size="23" font-weight="700" fill="#172b3a">Биржевая сделка с бумагами</text><rect x="20.0" y="50" width="176.66666666666666" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="32.0" y="77" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">1.</text><text x="32.0" y="101" font-family="Arial" font-size="18" fill="#425565">Решение</text><rect x="208.66666666666666" y="50" width="176.66666666666666" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="220.66666666666666" y="77" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">2.</text><text x="220.66666666666666" y="101" font-family="Arial" font-size="18" fill="#425565">Поручение</text><rect x="397.3333333333333" y="50" width="176.66666666666666" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="409.3333333333333" y="77" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">3.</text><text x="409.3333333333333" y="101" font-family="Arial" font-size="18" fill="#425565">Сделка</text><rect x="586.0" y="50" width="176.66666666666666" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="598.0" y="77" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">4.</text><text x="598.0" y="101" font-family="Arial" font-size="18" fill="#425565">Обязательства</text><rect x="774.6666666666666" y="50" width="176.66666666666666" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="786.6666666666666" y="77" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">5.</text><text x="786.6666666666666" y="101" font-family="Arial" font-size="18" fill="#425565">Расчёты</text><rect x="963.3333333333333" y="50" width="176.66666666666666" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="975.3333333333333" y="77" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">6.</text><text x="975.3333333333333" y="101" font-family="Arial" font-size="18" fill="#425565">Права на бумаги</text><text x="20" y="177" font-family="Arial" font-size="19" fill="#425565">Запись о сделке появляется до расчётов. После движения активов учёт обновляется, а записи сверяются.</text><text x="20" y="250" font-family="Arial" font-size="23" font-weight="700" fill="#172b3a">Сопровождение вложения</text><rect x="20.0" y="270" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="32.0" y="297" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">1.</text><text x="32.0" y="321" font-family="Arial" font-size="18" fill="#425565">Состояние портфеля</text><rect x="246.4" y="270" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="258.4" y="297" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">2.</text><text x="258.4" y="321" font-family="Arial" font-size="18" fill="#425565">Событие или срок</text><rect x="472.8" y="270" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="484.8" y="297" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">3.</text><text x="484.8" y="321" font-family="Arial" font-size="18" fill="#425565">Выплата или</text><text x="484.8" y="344" font-family="Arial" font-size="18" fill="#425565">инструкция</text><rect x="699.2" y="270" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="711.2" y="297" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">4.</text><text x="711.2" y="321" font-family="Arial" font-size="18" fill="#425565">Обновление учёта</text><rect x="925.6" y="270" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="937.6" y="297" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">5.</text><text x="937.6" y="321" font-family="Arial" font-size="18" fill="#425565">Оценка результата</text><text x="20" y="397" font-family="Arial" font-size="19" fill="#425565">Выплата и исполнение договора могут снова потребовать расчётов. Пересмотр может закончиться сохранением</text><text x="20" y="422" font-family="Arial" font-size="19" fill="#425565">позиции.</text><text x="20" y="470" font-family="Arial" font-size="23" font-weight="700" fill="#172b3a">Операции с паем фонда</text><rect x="20.0" y="490" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="32.0" y="517" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">1.</text><text x="32.0" y="541" font-family="Arial" font-size="18" fill="#425565">Сверенные активы</text><rect x="246.4" y="490" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="258.4" y="517" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">2.</text><text x="258.4" y="541" font-family="Arial" font-size="18" fill="#425565">Оценка имущества</text><rect x="472.8" y="490" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="484.8" y="517" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">3.</text><text x="484.8" y="541" font-family="Arial" font-size="18" fill="#425565">Стоимость пая</text><rect x="699.2" y="490" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="711.2" y="517" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">4.</text><text x="711.2" y="541" font-family="Arial" font-size="18" fill="#425565">Выдача или</text><text x="711.2" y="564" font-family="Arial" font-size="18" fill="#425565">погашение</text><rect x="925.6" y="490" width="214.4" height="92" rx="10" fill="#f3f6f8" stroke="#dbe3e8"/><text x="937.6" y="517" font-family="Arial" font-size="19" font-weight="700" fill="#172b3a">5.</text><text x="937.6" y="541" font-family="Arial" font-size="18" fill="#425565">Деньги и учёт</text><text x="20" y="617" font-family="Arial" font-size="19" fill="#425565">Выдача или погашение требуют заявки и применимых условий фонда. Вторичная покупка пая относится к обычной</text><text x="20" y="642" font-family="Arial" font-size="19" fill="#425565">сделке.</text></svg>
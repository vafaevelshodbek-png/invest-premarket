<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1084" viewBox="0 0 1160 1084" role="img"><title>Работы участников инвестиционной деятельности</title><rect width="100%" height="100%" fill="white"/><rect x="20.0" y="20" width="551.0" height="225" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="40.0" y="54" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Информация и выбор</text><text x="40.0" y="92" font-family="Arial, sans-serif" font-size="19" fill="#425565">Определить цели и ограничения</text><text x="40.0" y="132" font-family="Arial, sans-serif" font-size="19" fill="#425565">Собрать сведения для конкретного решения</text><text x="40.0" y="172" font-family="Arial, sans-serif" font-size="19" fill="#425565">Оценить инструмент и варианты портфеля</text><text x="40.0" y="212" font-family="Arial, sans-serif" font-size="19" fill="#425565">Выбрать действие и параметры</text><rect x="589.0" y="20" width="551.0" height="260" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="609.0" y="54" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Сделка</text><text x="609.0" y="92" font-family="Arial, sans-serif" font-size="19" fill="#425565">Оформить, зарегистрировать и проверить</text><text x="609.0" y="117" font-family="Arial, sans-serif" font-size="19" fill="#425565">конкретное поручение</text><text x="609.0" y="157" font-family="Arial, sans-serif" font-size="19" fill="#425565">Подать и сопроводить заявку на первичное</text><text x="609.0" y="182" font-family="Arial, sans-serif" font-size="19" fill="#425565">размещение</text><text x="609.0" y="222" font-family="Arial, sans-serif" font-size="19" fill="#425565">Заключить сделку и обработать состояние</text><text x="609.0" y="247" font-family="Arial, sans-serif" font-size="19" fill="#425565">поручения</text><rect x="20.0" y="263" width="551.0" height="365" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="40.0" y="297" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Обязательства и расчёты</text><text x="40.0" y="335" font-family="Arial, sans-serif" font-size="19" fill="#425565">Подтвердить параметры и согласовать</text><text x="40.0" y="360" font-family="Arial, sans-serif" font-size="19" fill="#425565">расчетные инструкции</text><text x="40.0" y="400" font-family="Arial, sans-serif" font-size="19" fill="#425565">Определить обязательства и требования</text><text x="40.0" y="440" font-family="Arial, sans-serif" font-size="19" fill="#425565">Исполнить денежные и поставочные</text><text x="40.0" y="465" font-family="Arial, sans-serif" font-size="19" fill="#425565">обязательства</text><text x="40.0" y="505" font-family="Arial, sans-serif" font-size="19" fill="#425565">Организовать фондирование и движение</text><text x="40.0" y="530" font-family="Arial, sans-serif" font-size="19" fill="#425565">обеспечения</text><text x="40.0" y="570" font-family="Arial, sans-serif" font-size="19" fill="#425565">Обработать наступление срока, исполнение,</text><text x="40.0" y="595" font-family="Arial, sans-serif" font-size="19" fill="#425565">перенос или прекращение</text><rect x="589.0" y="298" width="551.0" height="380" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="609.0" y="332" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Портфель и выплаты</text><text x="609.0" y="370" font-family="Arial, sans-serif" font-size="19" fill="#425565">Оценить текущее состояние портфеля</text><text x="609.0" y="410" font-family="Arial, sans-serif" font-size="19" fill="#425565">Обработать выплаты и обязательные изменения</text><text x="609.0" y="435" font-family="Arial, sans-serif" font-size="19" fill="#425565">прав</text><text x="609.0" y="475" font-family="Arial, sans-serif" font-size="19" fill="#425565">Направить волеизъявление по корпоративному</text><text x="609.0" y="500" font-family="Arial, sans-serif" font-size="19" fill="#425565">действию</text><text x="609.0" y="540" font-family="Arial, sans-serif" font-size="19" fill="#425565">Измерить результат портфеля и качество</text><text x="609.0" y="565" font-family="Arial, sans-serif" font-size="19" fill="#425565">исполнения</text><text x="609.0" y="605" font-family="Arial, sans-serif" font-size="19" fill="#425565">Оценить имущество и обязательства фонда</text><text x="609.0" y="645" font-family="Arial, sans-serif" font-size="19" fill="#425565">Выдать, обменять или погасить паи</text><rect x="20.0" y="646" width="551.0" height="420" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="40.0" y="680" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Записи и отчётность</text><text x="40.0" y="718" font-family="Arial, sans-serif" font-size="19" fill="#425565">Зафиксировать права и движения по бумагам</text><text x="40.0" y="758" font-family="Arial, sans-serif" font-size="19" fill="#425565">Отразить операции у профучастника</text><text x="40.0" y="798" font-family="Arial, sans-serif" font-size="19" fill="#425565">Сопоставить внутренние и внешние записи</text><text x="40.0" y="838" font-family="Arial, sans-serif" font-size="19" fill="#425565">Отразить инвестиционные операции</text><text x="40.0" y="863" font-family="Arial, sans-serif" font-size="19" fill="#425565">организации</text><text x="40.0" y="903" font-family="Arial, sans-serif" font-size="19" fill="#425565">Определить и исполнить налоговые</text><text x="40.0" y="928" font-family="Arial, sans-serif" font-size="19" fill="#425565">обязанности</text><text x="40.0" y="968" font-family="Arial, sans-serif" font-size="19" fill="#425565">Сформировать и передать отчет клиенту</text><text x="40.0" y="1008" font-family="Arial, sans-serif" font-size="19" fill="#425565">Подготовить регуляторные и репозитарные</text><text x="40.0" y="1033" font-family="Arial, sans-serif" font-size="19" fill="#425565">сведения</text></svg>
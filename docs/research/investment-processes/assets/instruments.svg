<svg xmlns="http://www.w3.org/2000/svg" width="960" height="572" viewBox="0 0 960 572" role="img"><title>instruments</title><rect width="100%" height="100%" fill="#ffffff"/><rect x="24.0" y="24" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44.0" y="58" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Акции</text><text x="44.0" y="100" font-family="Arial, sans-serif" font-size="18" fill="#425565">Доля в компании и права акционера.</text><rect x="488.0" y="24" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508.0" y="58" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Облигации и депозиты</text><text x="508.0" y="100" font-family="Arial, sans-serif" font-size="18" fill="#425565">Требование к заёмщику или банку на</text><text x="508.0" y="125" font-family="Arial, sans-serif" font-size="18" fill="#425565">условиях вложения.</text><rect x="24.0" y="204" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44.0" y="238" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Паи фондов</text><text x="44.0" y="280" font-family="Arial, sans-serif" font-size="18" fill="#425565">Доля в имуществе, которым управляет</text><text x="44.0" y="305" font-family="Arial, sans-serif" font-size="18" fill="#425565">управляющая компания.</text><rect x="488.0" y="204" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508.0" y="238" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Производные инструменты</text><text x="508.0" y="280" font-family="Arial, sans-serif" font-size="18" fill="#425565">Договорные права и обязательства,</text><text x="508.0" y="305" font-family="Arial, sans-serif" font-size="18" fill="#425565">зависящие от цены или показателя.</text><rect x="24.0" y="384" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44.0" y="418" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Валюта</text><text x="44.0" y="460" font-family="Arial, sans-serif" font-size="18" fill="#425565">Деньги в выбранной валюте после обмена.</text><rect x="488.0" y="384" width="448.0" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508.0" y="418" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172b3a">Драгоценные металлы</text><text x="508.0" y="460" font-family="Arial, sans-serif" font-size="18" fill="#425565">Прямое владение металлом. Покупка пая</text><text x="508.0" y="485" font-family="Arial, sans-serif" font-size="18" fill="#425565">или контракта имеет другую форму.</text></svg>

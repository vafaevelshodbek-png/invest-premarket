<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760"><title>Области вложений и денежный рынок</title><rect width="100%" height="100%" fill="white"/><rect x="24" y="24" width="448" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44" y="59" font-family="Arial" font-size="21" font-weight="700" fill="#172b3a">Акции</text><text x="44" y="101" font-family="Arial" font-size="18" fill="#425565">Доля в компании и права акционера.</text><rect x="488" y="24" width="448" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508" y="59" font-family="Arial" font-size="21" font-weight="700" fill="#172b3a">Облигации</text><text x="508" y="101" font-family="Arial" font-size="18" fill="#425565">Долговое требование по условиям выпуска.</text><rect x="24" y="204" width="448" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44" y="239" font-family="Arial" font-size="21" font-weight="700" fill="#172b3a">Паи фондов</text><text x="44" y="281" font-family="Arial" font-size="18" fill="#425565">Доля в имуществе, которым управляет</text><text x="44" y="306" font-family="Arial" font-size="18" fill="#425565">управляющая компания.</text><rect x="488" y="204" width="448" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508" y="239" font-family="Arial" font-size="21" font-weight="700" fill="#172b3a">Производные инструменты</text><text x="508" y="281" font-family="Arial" font-size="18" fill="#425565">Договорные права и обязательства,</text><text x="508" y="306" font-family="Arial" font-size="18" fill="#425565">зависящие от цены или показателя.</text><rect x="24" y="384" width="448" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="44" y="419" font-family="Arial" font-size="21" font-weight="700" fill="#172b3a">Валюта</text><text x="44" y="461" font-family="Arial" font-size="18" fill="#425565">Деньги в выбранной валюте после обмена.</text><rect x="488" y="384" width="448" height="164" rx="12" fill="#f3f6f8" stroke="#dbe3e8"/><text x="508" y="419" font-family="Arial" font-size="21" font-weight="700" fill="#172b3a">Драгоценные металлы</text><text x="508" y="461" font-family="Arial" font-size="18" fill="#425565">Прямое владение металлом. Пай и контракт</text><text x="508" y="486" font-family="Arial" font-size="18" fill="#425565">имеют другую форму.</text><rect x="24" y="580" width="912" height="156" rx="12" fill="#edf4ef" stroke="#d2e2d7"/><text x="44" y="616" font-family="Arial" font-size="21" font-weight="700" fill="#172b3a">Денежный рынок</text><text x="44" y="655" font-family="Arial" font-size="18" fill="#425565">Краткосрочное размещение и привлечение денег.</text><text x="44" y="683" font-family="Arial" font-size="18" fill="#425565">Включает депозиты и сделки с обязательством обратного выкупа.</text><text x="44" y="711" font-family="Arial" font-size="18" fill="#425565">Объединяет операции по назначению и пересекается с формами вложений выше.</text></svg>
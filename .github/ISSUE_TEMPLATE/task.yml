name: Самостоятельная задача отбора
description: Работа с целью, результатом, DoD и зависимостями
title: '[Задача] '
body:
- type: dropdown
  id: stream
  attributes:
    label: Стрим
    options:
    - Рынок и процессы
    - Продукт и ценность
    - Данные и система
    - AI и проверка
    - Сборка и подача
- type: textarea
  id: goal
  attributes:
    label: Цель
    description: Какой вопрос нужно решить и кому нужен результат?
  validations:
    required: true
- type: textarea
  id: work
  attributes:
    label: Что сделать и посмотреть
    description: Готовые пункты работы, исходные материалы и источники для старта.
  validations:
    required: true
- type: textarea
  id: result
  attributes:
    label: Результат и DoD
    description: Что передаём дальше и как проверить готовность?
  validations:
    required: true
- type: textarea
  id: handoff
  attributes:
    label: Передача работы
    description: Ведущий и проверяющий профили, зависимости, получатели результата и поля заявки.
labels:
- qualification

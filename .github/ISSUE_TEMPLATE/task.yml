name: Задача команды
description: Исследование, продукт, разработка, проверка или сдача
title: '[Задача] '
body:
- type: textarea
  id: result
  attributes:
    label: Что сделать
    description: Опишите результат и задачу, которую он помогает решить.
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Критерии готовности
    description: Перечислите признаки, по которым другой участник сможет принять результат.
  validations:
    required: true
- type: textarea
  id: context
  attributes:
    label: Материалы и зависимости
    description: Добавьте ссылки на Wiki, данные и задачи, от которых зависит работа.
- type: textarea
  id: evidence
  attributes:
    label: Результат и проверка
    description: При завершении укажите ссылку на результат, способ проверки и ограничения.

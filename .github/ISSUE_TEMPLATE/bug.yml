name: Ошибка или блокировка
description: Ошибка или блокировка подготовки первого отбора
title: '[Ошибка] '
labels:
- bug
- qualification
body:
- type: textarea
  id: expected
  attributes:
    label: Ожидаемый и фактический результат
    description: Опишите, что должно было произойти и что получилось.
  validations:
    required: true
- type: textarea
  id: reproduce
  attributes:
    label: Как повторить ошибку
    description: Укажите версию, шаги, входные данные и безопасные выдержки из журналов.
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: Влияние и следующий шаг
    description: Укажите, что заблокировано, кто может помочь и есть ли обходной путь.
